name: PR

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: tools 테스트
        run: |
          pip install -r tools/requirements.txt
          python -m pytest -c tools/pytest.ini tools/tests

      - name: 정적 분석
        run: ./gradlew ktlintCheck detekt lint

      - name: 엔진 단위·속성 테스트
        run: ./gradlew :core:engine:test

      - name: 나머지 단위 테스트
        run: ./gradlew testDebugUnitTest

      - name: 릴리스 빌드 개발자 메뉴 미포함
        run: ./gradlew :app:testReleaseUnitTest --tests "*DevMenuReleaseTest*"

      - name: 스크린샷 회귀
        run: ./gradlew verifyRoborazziDebug

      - name: 디버그 빌드
        run: ./gradlew assembleDebug

      # 실패 시: Roborazzi 실제·기준·차이 이미지 + 테스트·정적 분석 리포트
      - name: 실패 리포트 보관
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qa-failure-reports
          retention-days: 14
          path: |
            **/build/outputs/roborazzi/
            **/build/reports/roborazzi/
            **/build/reports/tests/
            **/build/test-results/
            **/build/reports/lint-results*
            **/build/reports/detekt/
            **/build/reports/ktlint/
          if-no-files-found: ignore

      # 성공해도 스크린샷 비교 결과는 확인할 수 있게
      - name: Roborazzi 리포트 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roborazzi-report
          retention-days: 7
          path: |
            **/build/outputs/roborazzi/
            **/build/reports/roborazzi/
          if-no-files-found: ignore
