name: Nightly

on:
  schedule:
    - cron: "0 18 * * *" # 매일 03:00 KST
  workflow_dispatch:

jobs:
  holiday-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -r tools/requirements.txt

      # 종료 코드 0 동일 · 1 차이 있음 · 2 설정/네트워크 오류
      - name: 공휴일 동기화
        id: sync
        env:
          KASI_SERVICE_KEY: ${{ secrets.KASI_SERVICE_KEY }}
        run: |
          set +e
          python tools/holiday_sync/holiday_sync.py > sync.md
          code=$?
          cat sync.md
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 2 ]; then exit 1; fi
          exit 0

      - name: 차이 있으면 이슈 생성
        if: steps.sync.outputs.code == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create             --title "공휴일 데이터 변경 감지 $(date +%Y-%m-%d)"             --body-file sync.md

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: 디버그 빌드
        run: ./gradlew assembleDebug

      # TODO(Phase 6): 에뮬레이터에서 Maestro 전체 + monkey 5,000 이벤트
      - name: Maestro · monkey
        run: echo "TODO: maestro test .maestro/ && adb shell monkey (Phase 6)"
