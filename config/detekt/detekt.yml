# 기본 설정 위에 덮어쓰는 값만 둔다
naming:
  FunctionNaming:
    ignoreAnnotated:
      - Composable
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9_]*'

style:
  MagicNumber:
    ignorePropertyDeclaration: true
    ignoreAnnotated:
      - Preview
    excludes:
      - '**/test/**'
      - '**/ui/theme/**'
  UnusedPrivateFunction:
    ignoreAnnotated:
      - Preview

complexity:
  LongParameterList:
    ignoreDefaultParameters: true
    ignoreAnnotated:
      - Composable
